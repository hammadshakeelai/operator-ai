<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Amber Glow -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 243, 255, 0.04)" stroke-width="1.5" />
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 243, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Terminal Box Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#cyberGrid)"/>
  <rect width="1200" height="420" fill="url(#scanlines)"/>

  <!-- Left Accent Tech Bracket -->
  <path d="M 40 60 L 70 60 L 70 90 M 40 360 L 70 360 L 70 330" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.6"/>
  <!-- Right Accent Tech Bracket -->
  <path d="M 1160 60 L 1130 60 L 1130 90 M 1160 360 L 1130 360 L 1130 330" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.6"/>

  <!-- Top System Header Status Bar -->
  <rect x="80" y="45" width="1040" height="24" rx="4" fill="rgba(11, 23, 44, 0.8)" stroke="rgba(0, 243, 255, 0.2)" stroke-width="1"/>
  <circle cx="95" cy="57" r="4" fill="#ef4444"/>
  <circle cx="110" cy="57" r="4" fill="#f59e0b"/>
  <circle cx="125" cy="57" r="4" fill="#10b981"/>
  <text x="145" y="61" fill="#64748b" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.5">FDI-INTEL // CLASSIFIED CONSOLE v2.4 // SECURE FREQ: 142.85 MHz</text>
  <text x="960" y="61" fill="#00f3ff" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="1.5">[ONLINE • 4-9B LLM]</text>

  <!-- Center Decorative Radar / Waveform -->
  <g transform="translate(860, 210)" opacity="0.45">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00f3ff" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#00f3ff" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#00f3ff" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="0" y1="0" x2="65" y2="-55" stroke="#10b981" stroke-width="2"/>
    <circle cx="65" cy="-55" r="5" fill="#10b981" filter="url(#glow)"/>
    <text x="75" y="-55" fill="#10b981" font-family="'Courier New', monospace" font-size="10">AGENT LOCATED</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(100, 150)">
    <!-- Subtitle Badge -->
    <rect x="0" y="-35" width="220" height="22" rx="3" fill="rgba(0, 243, 255, 0.15)" stroke="#00f3ff" stroke-width="1"/>
    <text x="12" y="-20" fill="#00f3ff" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="2">PROJECT: THE OPERATOR</text>

    <!-- Main Title -->
    <text x="0" y="45" fill="#ffffff" font-family="'Segoe UI', 'Impact', sans-serif" font-weight="900" font-size="64" letter-spacing="2" filter="url(#glow)">
      OPERATOR <tspan fill="url(#cyanGlow)">// AI</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="85" fill="#94a3b8" font-family="'Courier New', monospace" font-size="16" letter-spacing="1">
      CYBER INTELLIGENCE TERMINAL &bull; 4-9B LLM COPILOT &bull; LOCAL VOICE COMM
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 125)">
      <!-- Badge 1: 4-9B LLM -->
      <rect x="0" y="0" width="155" height="32" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#00f3ff" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" fill="#00f3ff"/>
      <text x="28" y="21" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">QWEN / LLAMA 7B</text>

      <!-- Badge 2: Local WebGPU -->
      <rect x="165" y="0" width="165" height="32" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="181" cy="16" r="4" fill="#10b981"/>
      <text x="193" y="21" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">WEBGPU + OLLAMA</text>

      <!-- Badge 3: Voice Comms -->
      <rect x="340" y="0" width="160" height="32" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#ffb703" stroke-width="1.2"/>
      <circle cx="356" cy="16" r="4" fill="#ffb703"/>
      <text x="368" y="21" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">TACTICAL VOICE I/O</text>

      <!-- Badge 4: GitHub Pages -->
      <rect x="510" y="0" width="145" height="32" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="526" cy="16" r="4" fill="#818cf8"/>
      <text x="538" y="21" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">GITHUB PAGES</text>
    </g>
  </g>

  <!-- Bottom Terminal Decorative Prompt -->
  <g transform="translate(100, 360)">
    <text x="0" y="0" fill="#00f3ff" font-family="'Courier New', monospace" font-size="13" font-weight="bold">operator@fdi-station-49:~$</text>
    <text x="220" y="0" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="13">init_case --case 049 --agent walker --model qwen2.5:7b --voice on</text>
    <rect x="760" y="-12" width="8" height="15" fill="#00f3ff" opacity="0.8"/>
  </g>

  <!-- Audio Waveform Graphic in Corner -->
  <g transform="translate(950, 340)">
    <line x1="0" y1="10" x2="0" y2="-10" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="16" x2="8" y2="-16" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="8" x2="16" y2="-8" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="24" y2="-24" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="14" x2="32" y2="-14" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="28" x2="40" y2="-28" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="12" x2="48" y2="-12" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="20" x2="56" y2="-20" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="6" x2="64" y2="-6" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="5" fill="#64748b" font-family="'Courier New', monospace" font-size="10">VOX RX ACTIVE</text>
  </g>
</svg>
